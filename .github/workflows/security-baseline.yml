name: Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-deploy-secrets:
    name: Validate Required Deploy Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_API_CLIENT_ID: ${{ secrets.AZURE_API_CLIENT_ID }}
    steps:
      - name: Check required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            JWT_SECRET
            SESSION_SECRET
            REDIS_PASSWORD
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_API_CLIENT_ID
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing secret::Repository secret '$name' is not configured"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required deployment secrets are missing."
            exit 1
          fi

          echo "All required deployment secrets are configured."
