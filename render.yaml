services:
  - type: web
    name: mynored-desk-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@mynsa-desk/web"
    startCommand: "pnpm --filter @mynsa-desk/web exec next start --hostname 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: mynored-desk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mynored-desk-cache
          property: connectionString
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: mynored-desk-api
          property: hostport
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_WEB_URL
        sync: false

  - type: web
    name: mynored-desk-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mynsa-desk/database build"
    preDeployCommand: "pnpm --filter @mynsa-desk/database exec prisma migrate deploy"
    startCommand: "pnpm --filter my-nsa-desk-api exec ts-node --transpile-only src/main.ts"
    healthCheckPath: /api/health
    disk:
      name: memo-storage
      mountPath: /opt/render/project/src/apps/api/public/generated_memos
      sizeGB: 5
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mynored-desk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mynored-desk-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGIN
        sync: false
      - key: MEMO_STORAGE_DIR
        value: /opt/render/project/src/apps/api/public/generated_memos

  - type: keyvalue
    name: mynored-desk-cache
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: mynored-desk-db
    plan: basic-1gb
    region: frankfurt
    ipAllowList: []
